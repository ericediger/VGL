<svg xmlns="http://www.w3.org/2000/svg" width="920" height="155" viewBox="0 0 920 155" role="img" aria-labelledby="t d"><title id="t">Replay architecture</title><desc id="d">Saved language-model steps provide the frame and claims. A versioned PostgreSQL resolver and Python rules run locally.</desc><rect width="920" height="155" rx="8" fill="#f8f7f1"/><rect x="8" y="17" width="288" height="118" rx="7" fill="#fffefa" stroke="#a8bcb0"/><g fill="#126357" font-family="Arial,sans-serif"><text x="23" y="48" font-size="12" font-weight="bold">01   REPLAY</text><text x="23" y="81" font-family="Georgia,serif" font-size="23" fill="#1b3731">Interpret &amp; select</text><text x="23" y="109" font-size="14">Saved frame and entry concepts</text></g><rect x="314" y="17" width="288" height="118" rx="7" fill="#fffefa" stroke="#a8bcb0"/><g fill="#126357" font-family="Arial,sans-serif"><text x="329" y="48" font-size="12" font-weight="bold">02   RESOLVE</text><text x="329" y="81" font-family="Georgia,serif" font-size="23" fill="#1b3731">Select evidence</text><text x="329" y="109" font-size="14">Release, date and jurisdiction</text></g><rect x="620" y="17" width="288" height="118" rx="7" fill="#fffefa" stroke="#a8bcb0"/><g fill="#126357" font-family="Arial,sans-serif"><text x="635" y="48" font-size="12" font-weight="bold">03   CHECK</text><text x="635" y="81" font-family="Georgia,serif" font-size="23" fill="#1b3731">Inspect claims</text><text x="635" y="109" font-size="14">Saved composition and citation rules</text></g></svg>
